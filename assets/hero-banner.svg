<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nguyen Duc Danh - AI Systems and Applied Research">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>

    <radialGradient id="orbOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF8A00" fill-opacity="0.1" />
    </pattern>

    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="338" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="340" fill="url(#bgGrad)" />
    <rect width="1200" height="340" fill="url(#dotMatrix)" />

    <circle cx="980" cy="170" r="240" fill="url(#orbViolet)">
      <animate attributeName="r" values="225;255;225" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="860" cy="140" r="180" fill="url(#orbOrange)">
      <animate attributeName="r" values="170;200;170" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Top Spectrum Line -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

    <!-- RIGHT SIDE: Neural Brain / Graph Network -->
    <g transform="translate(735, 30)">
      <rect x="0" y="0" width="425" height="280" rx="12" fill="#111A30" fill-opacity="0.75" stroke="#FF8A00" stroke-opacity="0.28" />
      <line x1="0" y1="28" x2="425" y2="28" stroke="#8B5CF6" stroke-opacity="0.2" />
      <circle cx="16" cy="14" r="3.5" fill="#FF8A00" />
      <circle cx="28" cy="14" r="3.5" fill="#C084FC" />
      <circle cx="40" cy="14" r="3.5" fill="#8B5CF6" fill-opacity="0.6" />
      <text x="408" y="18" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1.2" fill="#CBD5E1">
        NEURAL // SYNAPSE_GRAPH
      </text>

      <!-- NEURAL BRAIN EDGES -->
      <g stroke="url(#brainGrad)" stroke-opacity="0.45" stroke-width="1.5" fill="none">
        <path d="M65,75 Q120,55 175,105 T280,85 T365,115" />
        <path d="M65,135 Q130,155 190,115 T275,155 T365,135" />
        <path d="M65,195 Q120,215 185,165 T280,195 T365,165" />
        <path d="M65,75 L185,165" stroke-opacity="0.25" />
        <path d="M65,195 L175,105" stroke-opacity="0.25" />
        <path d="M175,105 L275,155" stroke-opacity="0.35" />
        <path d="M190,115 L280,85" stroke-opacity="0.35" />
        <path d="M185,165 L365,115" stroke-opacity="0.3" />
        <path d="M275,155 L365,165" stroke-opacity="0.4" />
      </g>

      <!-- ANIMATED SIGNAL PULSES -->
      <circle r="3.5" fill="#FF8A00">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M65,75 Q120,55 175,105 T280,85 T365,115" />
      </circle>
      <circle r="3" fill="#E8EEFF">
        <animateMotion dur="2.1s" repeatCount="indefinite" path="M65,135 Q130,155 190,115 T275,155 T365,135" />
      </circle>
      <circle r="3.5" fill="#C084FC">
        <animateMotion dur="2.8s" repeatCount="indefinite" path="M65,195 Q120,215 185,165 T280,195 T365,165" />
      </circle>
      <circle r="2.5" fill="#FFB03B">
        <animateMotion dur="1.8s" repeatCount="indefinite" path="M175,105 L275,155" />
      </circle>

      <!-- NEURAL NODES -->
      <circle cx="65" cy="75" r="6" fill="#0B1020" stroke="#FF8A00" stroke-width="2.2" />
      <circle cx="65" cy="135" r="6" fill="#0B1020" stroke="#FF9E3B" stroke-width="2.2" />
      <circle cx="65" cy="195" r="6" fill="#0B1020" stroke="#C084FC" stroke-width="2.2" />

      <circle cx="120" cy="60" r="4.5" fill="#FF8A00" fill-opacity="0.8" />
      <circle cx="175" cy="105" r="7.5" fill="#0B1020" stroke="#D8B4FE" stroke-width="2.5" />
      <circle cx="190" cy="115" r="5" fill="#C084FC" />
      <circle cx="185" cy="165" r="8" fill="#0B1020" stroke="#FF8A00" stroke-width="2.5" />
      <circle cx="130" cy="155" r="4.5" fill="#A855F7" fill-opacity="0.8" />

      <circle cx="280" cy="85" r="7" fill="#0B1020" stroke="#FF8A00" stroke-width="2.5" />
      <circle cx="275" cy="155" r="6" fill="#C084FC" fill-opacity="0.9" />
      <circle cx="280" cy="195" r="5" fill="#8B5CF6" />

      <circle cx="365" cy="115" r="9" fill="#0B1020" stroke="#FF8A00" stroke-width="3">
        <animate attributeName="r" values="8;10.5;8" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="365" cy="165" r="7.5" fill="#0B1020" stroke="#C084FC" stroke-width="2.5" />

      <!-- Bottom Telemetry Bar -->
      <line x1="16" y1="250" x2="409" y2="250" stroke="#8B5CF6" stroke-opacity="0.2" />
      <text x="20" y="266" font-family="monospace" font-size="9.5" fill="#FFB03B">MODEL: DEEP_GRAPH</text>
      <text x="212" y="266" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#CBD5E1">WEIGHTS: OPTIMIZED</text>
      <text x="405" y="266" text-anchor="end" font-family="monospace" font-size="9.5" fill="#C084FC">STATUS: ACTIVE</text>
    </g>

    <!-- LEFT SIDE: Tall Banner, Larger Bold Text, Bigger Terminal & Single-Row Pills -->
    <g transform="translate(42, 48)">
      <!-- Name -->
      <text x="0" y="56" font-family="sans-serif" font-size="48" font-weight="900" letter-spacing="1.8" fill="url(#titleGrad)">
        NGUYEN DUC DANH
      </text>

      <!-- Pro Hacker Terminal Box (Larger font size 13px) -->
      <g transform="translate(0, 85)">
        <rect x="0" y="0" width="460" height="36" rx="7" fill="#0D1322" stroke="#4F8CFF" stroke-width="1.8" stroke-opacity="0.8" />
        <circle cx="15" cy="18" r="4" fill="#EF4444" />
        <circle cx="28" cy="18" r="4" fill="#F59E0B" />
        <circle cx="41" cy="18" r="4" fill="#10B981" />
        <line x1="54" y1="9" x2="54" y2="27" stroke="#334155" stroke-width="1" />
        <text x="68" y="23" font-family="monospace" font-size="13" font-weight="800" fill="#93C5FD">
          danhnd@ubuntu:~$ <tspan fill="#34D399">./init_ai_engine.sh</tspan>
        </text>
      </g>

      <!-- 4 Capability Pills in ONE SINGLE ROW (Larger font size 12px, optimized width for 1 line) -->
      <g transform="translate(0, 142)" font-family="monospace" font-size="12" font-weight="900">
        <!-- Pill 1: CV -->
        <rect x="0" y="0" width="80" height="36" rx="7" fill="#111A30" stroke="#FF8A00" stroke-width="2" stroke-opacity="0.9" />
        <text x="40" y="23" text-anchor="middle" fill="#FFB03B">CV</text>

        <!-- Pill 2: NLP -->
        <rect x="88" y="0" width="80" height="36" rx="7" fill="#111A30" stroke="#C084FC" stroke-width="2" stroke-opacity="0.9" />
        <text x="128" y="23" text-anchor="middle" fill="#E9D5FF">NLP</text>

        <!-- Pill 3: MULTIMODAL LLM -->
        <rect x="176" y="0" width="168" height="36" rx="7" fill="#111A30" stroke="#A855F7" stroke-width="2" stroke-opacity="0.9" />
        <text x="260" y="23" text-anchor="middle" fill="#D8B4FE">MULTIMODAL LLM</text>

        <!-- Pill 4: AGENTIC AI -->
        <rect x="352" y="0" width="134" height="36" rx="7" fill="#111A30" stroke="#4F8CFF" stroke-width="2" stroke-opacity="0.9" />
        <text x="419" y="23" text-anchor="middle" fill="#BAE6FD">AGENTIC AI</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" stroke="#FF8A00" stroke-opacity="0.3" />
</svg>
