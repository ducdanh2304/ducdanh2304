<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nguyen Duc Danh - AI Systems and Applied Research">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8EEFF" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Gradient Cam - Tím - Xanh dương theo ý bạn -->
    <linearGradient id="cyberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>

    <linearGradient id="coreRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <radialGradient id="orbOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF8A00" fill-opacity="0.1" />
    </pattern>

    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="308" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="310" fill="url(#bgGrad)" />
    <rect width="1200" height="310" fill="url(#dotMatrix)" />

    <circle cx="980" cy="155" r="240" fill="url(#orbViolet)">
      <animate attributeName="r" values="225;255;225" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="100" r="180" fill="url(#orbOrange)">
      <animate attributeName="r" values="170;200;170" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Top Spectrum Line (Orange -> Purple -> Blue) -->
    <rect x="0" y="0" width="1200" height="3.5" fill="url(#cyberGrad)" />

    <!-- RIGHT SIDE: Multimodal & Agentic Graph (Cam - Tím - Xanh) -->
    <g transform="translate(740, 28)">
      <rect x="0" y="0" width="415" height="254" rx="12" fill="#111A30" fill-opacity="0.7" stroke="#FF8A00" stroke-opacity="0.25" />
      <line x1="0" y1="28" x2="415" y2="28" stroke="#8B5CF6" stroke-opacity="0.2" />
      <circle cx="16" cy="14" r="3.5" fill="#FF8A00" />
      <circle cx="28" cy="14" r="3.5" fill="#A855F7" />
      <circle cx="40" cy="14" r="3.5" fill="#3B82F6" fill-opacity="0.6" />
      <text x="398" y="18" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1" fill="#CBD5E1">
        SYS // AGENTIC_GRAPH_RUNNING
      </text>

      <!-- Input Modality Nodes -->
      <rect x="22" y="50" width="94" height="32" rx="6" fill="#0B1020" stroke="#FF8A00" stroke-opacity="0.75" />
      <text x="69" y="70" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFB03B">VISION</text>

      <rect x="22" y="114" width="94" height="32" rx="6" fill="#0B1020" stroke="#A855F7" stroke-opacity="0.75" />
      <text x="69" y="134" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#D8B4FE">NLP · IR</text>

      <rect x="22" y="178" width="94" height="32" rx="6" fill="#0B1020" stroke="#3B82F6" stroke-opacity="0.75" />
      <text x="69" y="198" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#93C5FD">VLM · OCR</text>

      <!-- Routing Lines -->
      <line x1="116" y1="66" x2="218" y2="122" stroke="#FF8A00" stroke-opacity="0.5" stroke-width="1.5" />
      <line x1="116" y1="130" x2="218" y2="130" stroke="#A855F7" stroke-opacity="0.6" stroke-width="1.5" />
      <line x1="116" y1="194" x2="218" y2="138" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.5" />

      <!-- Output Arrow -->
      <line x1="294" y1="130" x2="332" y2="130" stroke="url(#cyberGrad)" stroke-width="2" />
      <polygon points="331,126 339,130 331,134" fill="#A855F7" />

      <!-- Animated Running Data Pulses (Cam, Tím, Xanh chạy qua lại) -->
      <circle cx="116" cy="66" r="3.5" fill="#FF8A00">
        <animate attributeName="cx" values="116;218" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="cy" values="66;122" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="116" cy="130" r="3.5" fill="#C084FC">
        <animate attributeName="cx" values="116;218" dur="1.9s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite" />
      </circle>
      <circle cx="116" cy="194" r="3.5" fill="#60A5FA">
        <animate attributeName="cx" values="116;218" dur="2.7s" repeatCount="indefinite" />
        <animate attributeName="cy" values="194;138" dur="2.7s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite" />
      </circle>

      <!-- Agentic Reasoning Core (Glowing Ring) -->
      <circle cx="256" cy="130" r="44" fill="none" stroke="#FF8A00" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4">
        <animate attributeName="r" values="42;48;42" dur="3s" repeatCount="indefinite" />
        <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="256" cy="130" r="38" fill="#0B1020" stroke="url(#coreRing)" stroke-width="2.2" />
      <text x="256" y="126" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#FFB03B">AGENTIC</text>
      <text x="256" y="140" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#D8B4FE">CORE</text>

      <!-- Execution Output Node -->
      <rect x="340" y="106" width="56" height="48" rx="8" fill="#A855F7" fill-opacity="0.2" stroke="#C084FC" stroke-width="1.4" />
      <text x="368" y="127" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#FFB03B">EXEC</text>
      <text x="368" y="140" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#93C5FD">ONLINE</text>

      <!-- Telemetry Bar -->
      <line x1="16" y1="226" x2="399" y2="226" stroke="#8B5CF6" stroke-opacity="0.2" />
      <text x="20" y="242" font-family="monospace" font-size="9.5" fill="#FFB03B">STATE: ACTIVE</text>
      <text x="207" y="242" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#CBD5E1">FUSION: RRF + VLM</text>
      <text x="395" y="242" text-anchor="end" font-family="monospace" font-size="9.5" fill="#60A5FA">LATENCY: LOW</text>
    </g>

    <!-- LEFT SIDE: Editorial Identity -->
    <g transform="translate(52, 46)">
      <rect x="0" y="0" width="286" height="26" rx="6" fill="#111A30" stroke="#FF8A00" stroke-opacity="0.45" />
      <rect x="10" y="9" width="8" height="8" rx="2" fill="#FF8A00">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="26" y="17" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#FFB03B">
        AI SYSTEMS &amp; APPLIED ML
      </text>

      <text x="0" y="82" font-family="sans-serif" font-size="46" font-weight="800" letter-spacing="1.2" fill="url(#titleGrad)">
        NGUYEN DUC DANH
      </text>

      <text x="0" y="122" font-family="sans-serif" font-size="20" font-weight="700" fill="url(#cyberGrad)">
        Vision · Language · Multimodal · Agentic AI
      </text>

      <text x="0" y="156" font-family="sans-serif" font-size="14.5" fill="#A6B3D1">
        Architecting end-to-end perception, retrieval, and autonomous reasoning pipelines.
      </text>

      <g transform="translate(0, 184)" font-family="monospace" font-size="11" font-weight="600">
        <rect x="0" y="0" width="136" height="26" rx="5" fill="#111A30" stroke="#FF8A00" stroke-opacity="0.4" />
        <text x="68" y="17" text-anchor="middle" fill="#FFB03B">COMPUTER VISION</text>

        <rect x="148" y="0" width="124" height="26" rx="5" fill="#111A30" stroke="#A855F7" stroke-opacity="0.4" />
        <text x="210" y="17" text-anchor="middle" fill="#D8B4FE">NLP &amp; RETRIEVAL</text>

        <rect x="284" y="0" width="120" height="26" rx="5" fill="#111A30" stroke="#8B5CF6" stroke-opacity="0.45" />
        <text x="344" y="17" text-anchor="middle" fill="#C084FC">MULTIMODAL AI</text>

        <rect x="416" y="0" width="114" height="26" rx="5" fill="#111A30" stroke="#3B82F6" stroke-opacity="0.45" />
        <text x="473" y="17" text-anchor="middle" fill="#93C5FD">AGENTIC FLOWS</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="309" rx="16" stroke="#FF8A00" stroke-opacity="0.3" />
</svg>
