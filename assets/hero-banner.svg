<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nguyen Duc Danh — AI Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="55%" stop-color="#111A30" />
      <stop offset="100%" stop-color="#0B1020" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#4F8CFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4F8CFF" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="298" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="300" fill="url(#bgGrad)" />
    <rect width="1200" height="300" fill="url(#techGrid)" />

    <circle cx="960" cy="85" r="235" fill="url(#orbBlue)">
      <animate attributeName="r" values="225;250;225" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1075" cy="225" r="205" fill="url(#orbViolet)">
      <animate attributeName="r" values="205;180;205" dur="9s" repeatCount="indefinite" />
    </circle>

    <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)" />

    <!-- Right-Side Latent & Agentic Graph -->
    <g opacity="0.92">
      <line x1="805" y1="68" x2="925" y2="112" stroke="#4F8CFF" stroke-opacity="0.38" stroke-width="1.2" />
      <line x1="925" y1="112" x2="1075" y2="75" stroke="#8B5CF6" stroke-opacity="0.42" stroke-width="1.2" />
      <line x1="925" y1="112" x2="1010" y2="185" stroke="#60A5FA" stroke-opacity="0.48" stroke-width="1.4" />
      <line x1="805" y1="68" x2="848" y2="205" stroke="#4F8CFF" stroke-opacity="0.28" stroke-width="1" />
      <line x1="848" y1="205" x2="1010" y2="185" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="1.2" />
      <line x1="1010" y1="185" x2="1125" y2="225" stroke="#8B5CF6" stroke-opacity="0.48" stroke-width="1.2" />

      <circle r="3.5" fill="#60A5FA">
        <animateMotion dur="5s" repeatCount="indefinite" path="M805,68 L925,112 L1010,185 L1125,225" />
      </circle>
      <circle r="3" fill="#A78BFA">
        <animateMotion dur="6.5s" repeatCount="indefinite" path="M1075,75 L925,112 L848,205" />
      </circle>

      <circle cx="805" cy="68" r="5" fill="#111A30" stroke="#60A5FA" stroke-width="2" />
      <circle cx="925" cy="112" r="7" fill="#111A30" stroke="#8B5CF6" stroke-width="2.2">
        <animate attributeName="r" values="6.5;8.5;6.5" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="1075" cy="75" r="5" fill="#111A30" stroke="#A78BFA" stroke-width="2" />
      <circle cx="848" cy="205" r="4.5" fill="#111A30" stroke="#4F8CFF" stroke-width="1.8" />
      <circle cx="1010" cy="185" r="6" fill="#111A30" stroke="#60A5FA" stroke-width="2" />
      <circle cx="1125" cy="225" r="5" fill="#111A30" stroke="#8B5CF6" stroke-width="2" />

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#E8EEFF" opacity="0.82">
        <rect x="818" y="46" width="96" height="20" rx="4" fill="#111A30" stroke="#4F8CFF" stroke-opacity="0.4" />
        <text x="828" y="60">VISION · DET</text>

        <rect x="1024" y="162" width="126" height="20" rx="4" fill="#111A30" stroke="#8B5CF6" stroke-opacity="0.45" />
        <text x="1034" y="176">AGENTIC · FLOW</text>

        <rect x="774" y="222" width="132" height="20" rx="4" fill="#111A30" stroke="#60A5FA" stroke-opacity="0.4" />
        <text x="784" y="236">MULTIMODAL · IR</text>
      </g>
    </g>

    <!-- Left Editorial Typography -->
    <g transform="translate(56, 48)">
      <rect x="0" y="0" width="256" height="26" rx="13" fill="#111A30" stroke="#4F8CFF" stroke-opacity="0.5" />
      <circle cx="16" cy="13" r="4" fill="#60A5FA">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#A78BFA">
        AI ENGINEER · ENTHUSIAST
      </text>

      <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1.5" fill="#E8EEFF">
        NGUYEN DUC DANH
      </text>

      <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="url(#accentGrad)">
        Building Intelligence. Engineering Impact.
      </text>

      <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#A6B3D1">
        Designing practical AI systems across Computer Vision, NLP, Multimodal & Agentic AI.
      </text>

      <line x1="0" y1="174" x2="660" y2="174" stroke="#4F8CFF" stroke-opacity="0.22" stroke-width="1" />
      <text x="0" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="0.6" fill="#A6B3D1">
        <tspan fill="#60A5FA">COMPUTER VISION</tspan>   <tspan fill="#4F8CFF">·</tspan>   <tspan fill="#A78BFA">NLP & IR</tspan>   <tspan fill="#4F8CFF">·</tspan>   <tspan fill="#60A5FA">MULTIMODAL</tspan>   <tspan fill="#4F8CFF">·</tspan>   <tspan fill="#A78BFA">AGENTIC AI</tspan>
      </text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" stroke="#4F8CFF" stroke-opacity="0.35" />
</svg>
