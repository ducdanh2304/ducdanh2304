<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" role="img" aria-label="video-v2.svg"><style>
.type{font-family:Arial,Helvetica,sans-serif}
.move{stroke-dasharray:7 10;animation:slide 15s linear infinite}
.glow{animation:glow 3s ease-in-out infinite}
