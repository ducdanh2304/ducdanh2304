<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="detection.svg">
<style>
  .mono{font-family:'Courier New',monospace;letter-spacing:2px}
  .sans{font-family:Arial,Helvetica,sans-serif}
  .trace{stroke-dasharray:8 11;animation:flow 15s linear infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .slow{animation:orbit 24s linear infinite;transform-origin:930px 220px}
  .appear{animation:appear 1.2s ease-out both}
  .a2{animation-delay:.25s}.a3{animation-delay:.55s}
  @keyframes flow{to{stroke-dashoffset:-190}}
  @keyframes pulse{50%{opacity:.25;transform:scale(.76)}}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="240" rx="15" fill="#0b1723"/><path d="M0 6H1200" stroke="#e5a96d" stroke-width="5"/><path d="M680 20H1180V220H680Z" fill="#e5a96d" opacity=".06"/><text x="35" y="53" fill="#e5a96d" font-size="14" font-weight="700" class="mono" >CASE STUDY / 02</text><text x="35" y="111" fill="#eef3ff" font-size="45" font-weight="700" class="sans" >Multi-Vehicle Detection</text><text x="35" y="148" fill="#e5a96d" font-size="18" font-weight="700" class="mono" >COMPUTER VISION / DATA QUALITY</text><text x="35" y="184" fill="#b7cbd2" font-size="18" font-weight="400" class="sans" >Finding missing labels before improving the model.</text><text x="35" y="215" fill="#7997a3" font-size="13" font-weight="500" class="mono" >YOLOV8N   ·   LABEL AUDIT   ·   REPRODUCIBLE INFERENCE</text><rect x="735" y="55" width="150" height="92" fill="none" stroke="#e5a96d" stroke-width="2" class="trace" style="animation-delay:0.0s"/><rect x="905" y="72" width="110" height="108" fill="none" stroke="#62d9cc" stroke-width="2" class="trace" style="animation-delay:0.7s"/><rect x="1040" y="45" width="105" height="152" fill="none" stroke="#e5a96d" stroke-width="2" class="trace" style="animation-delay:1.4s"/><path d="M705 215H1160M705 33H1160" stroke="#667f89" opacity=".5"/></svg>