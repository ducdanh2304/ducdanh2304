nt-weight="400" class="sans" >FastAPI / Docker</text><text x="806" y="325" fill="#aec5ce" font-size="17" font-weight="400" class="sans" >Git · Linux / ONNX</text><text x="44" y="397" fill="#6e8994" font-size="12" font-weight="500" class="mono" >A WORKFLOW, NOT A LOGO COLLECTION</text></svg>